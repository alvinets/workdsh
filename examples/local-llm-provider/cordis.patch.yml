# 本地 OpenAI 兼容模型提供方示例（合并进 Profile 的 cordis.patch.yml）
#
# 取值必须按后端真实能力填写。关键约束见 README.md：
#   messageBudget  = contextWindow - maxTokens            必须 > 0
#   pressureBudget = messageBudget - headroomTokens        必须 > 0
# 任一 <= 0 时 compaction-basic 会跳过按压式 compaction，会话只增不减。

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      local-openai:
        displayName: Local OpenAI-compatible
        api: openai-completions
        baseURL: http://127.0.0.1:8000/v1
        # 凭据只引用环境变量，不写入配置；网关不校验时留空亦可。
        apiKeyEnv: LOCAL_OPENAI_API_KEY
        models:
          - id: your-model-id
            name: your-model-id
            # 必须小于后端真实上下文（本例后端 n_ctx 为 65536）。
            # 如实申报真实值：声明偏小会连带压低 maxTokens 的可用空间。
            contextWindow: 49152
            # 双重身份：既是输入预留（messageBudget = contextWindow − maxTokens），
            # 也是逐请求输出上限。必须显著小于 contextWindow，否则 messageBudget 为 0；
            # 调得过小则长文生成被输出上限截断，且输出截断不会被 compaction 补救。
            # 长文生成任务应改为按真实上下文申报并调高，见 README.md 的取舍表。
            maxTokens: 8192

# headroomTokens 默认 65536，会超过上面模型的整个消息预算，导致按压式
# compaction 被跳过。显式设为与 maxTokens 同量级即可得到正向压力预算。
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    headroomTokens: 8192
    thresholdRatio: 0.8
    # 单次溢出补救默认只有一次机会；失败不累加预算，重试次数过少时难以自愈。
    maxOverflowRetries: 3