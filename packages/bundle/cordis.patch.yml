# The official brand package registers the DeepSeek mark and name. It documents no
# brand configuration surface, so the only composition route is to retire it and
# occupy the same slots — done in src/client/harness/client.ts.
- id: ui-brand-official
  disabled: true

- insert:
    - id: workdsh-installation-probe
      name: workdsh-bundle
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-use-playwright-mcp
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      disabled: !!js "!!process.env.DSH_ELECTRON_EXECUTABLE"
      config:
        mode: launch
        headless: true
        executablePath: !!js "process.env.DSH_BROWSER_EXECUTABLE ?? (process.platform === 'darwin' ? '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' : undefined)"
    - id: workdsh-browser-session
      name: workdsh-provider-browser-session
      # Either executable satisfies the provider: electronExecutable is the
      # Desktop worker, executablePath the documented Web-only fallback. Gating
      # on Electron alone left the Web preview activating an entry that could
      # never satisfy its own guard.
      disabled: !!js "!process.env.DSH_ELECTRON_EXECUTABLE && !process.env.DSH_BROWSER_EXECUTABLE"
      config:
        electronExecutable: !!js "process.env.DSH_ELECTRON_EXECUTABLE"
        executablePath: !!js "process.env.DSH_BROWSER_EXECUTABLE"
    - id: auto-review
      name: '@deepseek-ai/dsh-experimental-auto-review'
- id: ui-sidebar-browser
  disabled: false
